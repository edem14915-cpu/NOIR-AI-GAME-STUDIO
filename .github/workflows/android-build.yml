name: NOIR AI Android Build

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Название папки игры в output"
        required: true
        type: string
        default: CoinCollector2D

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Validate project name
        run: |
          if [[ ! "$PROJECT_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid project name"
            exit 1
          fi
          echo "PROJECT_DIR=output/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Install Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip Godot_v4.4-stable_linux.x86_64.zip
          sudo mv Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q Godot_v4.4-stable_export_templates.tpz -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          cp -r "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Install Blender
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Generate 3D model with Blender
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        run: |
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-expr "import numpy; print('NumPy:', numpy.__version__)"
          blender --background --python tools/blender_test.py

      - name: Upload Blender 3D model
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-3D-Model
          path: output/blender_test/NOIR_Test.glb
          if-no-files-found: error

      - name: Generate NOIR 3D models
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        run: |
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python tools/noir_3d_generator.py -- building
          blender --background --python tools/noir_3d_generator.py -- car
          blender --background --python tools/noir_3d_generator.py -- tree

      - name: Copy Blender models into Godot project
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        run: |
          mkdir -p "$PROJECT_DIR/assets/models"
          cp output/noir_models/*.glb "$PROJECT_DIR/assets/models/"
          echo "Models copied into $PROJECT_DIR/assets/models"

      - name: Upload NOIR 3D models
        if: env.PROJECT_NAME == 'NOIR_3D_TEST'
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-3D-Models
          path: output/noir_models/*.glb
          if-no-files-found: error

      - name: Check project
        run: |
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --verbose --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/$PROJECT_DIR/build/NOIR.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/NOIR.apk
          if-no-files-found: error
